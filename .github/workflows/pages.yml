# Publicação no GitHub Pages (docs/adr/0002-estatico-primeiro.md, docs/changes/CHG-0007-publicacao.md).
#
# Só publica o que passou por toda a verificação do CI e, de novo, pelos testes E2E
# contra o artefato final, já com o subcaminho de produção (por exemplo, /Catoolicas).
#
# Pré-requisito (uma vez, por um administrador): Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; não cancela uma publicação já em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    uses: ./.github/workflows/ci.yml

  construir:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Instalar pnpm (versão do campo packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build com o subcaminho de produção
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Nenhum rascunho em revisão no build
        run: pnpm check:rascunhos

      - name: Orçamento de desempenho
        run: pnpm budget

      - name: Navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E contra o artefato a publicar
        run: pnpm test:e2e --project=chromium --project=chromium-movel
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
