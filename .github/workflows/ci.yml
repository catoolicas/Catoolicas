# Verificação em ambiente limpo a cada push e pull request.
# Ordem: tipos → lint → unitários → build → orçamento → licenças → REUSE → E2E contra o build.
# Também é chamado pelo workflow de publicação (pages.yml), que o executa antes de publicar;
# por isso pushes em `main` não disparam este workflow diretamente.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow é o nome do workflow chamador quando este é reutilizado: grupos distintos.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Instalar pnpm (versão do campo packageManager)
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm check

      - name: Lint e formatação
        run: pnpm lint

      - name: Testes unitários
        run: pnpm test:unit

      - name: Build estático
        run: pnpm build

      - name: Nenhum rascunho em revisão no build
        run: pnpm check:rascunhos

      - name: Orçamento de desempenho
        run: pnpm budget

      - name: Licenças das dependências
        run: pnpm licenses:check

      - name: Conformidade REUSE
        run: pipx run reuse lint

      - name: Navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Testes E2E (Chromium, Firefox e WebKit)
        run: pnpm test:e2e
