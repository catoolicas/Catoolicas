# Licenciamento por caminho, no padrão REUSE (https://reuse.software).
# Código, configuração e documentação do projeto: GPL-3.0-or-later.
# precedence = "closest": um arquivo com cabeçalho SPDX próprio ou arquivo `.license` ao lado
# (caso típico de textos, fontes e imagens de terceiros) NÃO herda esta anotação.
# Conteúdo de terceiros (textos religiosos, imagens, fontes) receberá anotações próprias,
# com a licença e a procedência de cada fonte (docs/adr/0003-conteudo-separado.md).
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Contribuidores do Catoolicas <https://github.com/catoolicas/Catoolicas>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Conteúdo do Terço importado do terco-diario (ver content/terco/SOURCES.md).
[[annotations]]
path = "content/terco/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 Korvo (garamogger) <https://github.com/garamogger/terco-diario>",
  "2026 Contribuidores do Catoolicas <https://github.com/catoolicas/Catoolicas>",
]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Conteúdo do Exame importado do terco-diario (ver content/exame/SOURCES.md).
[[annotations]]
path = "content/exame/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 Korvo (garamogger) <https://github.com/garamogger/terco-diario>",
  "2026 Contribuidores do Catoolicas <https://github.com/catoolicas/Catoolicas>",
]
SPDX-License-Identifier = "GPL-3.0-or-later"

# Rascunhos assistidos do Exame (e o arquivo gerado com os aprovados): redação do projeto, não do terco-diario.
[[annotations]]
path = ["content/exame/rascunhos.ts", "content/exame/rascunhos-aprovados.ts"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Contribuidores do Catoolicas <https://github.com/catoolicas/Catoolicas>"
SPDX-License-Identifier = "GPL-3.0-or-later"
